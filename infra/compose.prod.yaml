name: ai-hrms

services:
  postgres:
    image: ${AI_HRMS_POSTGRES_IMAGE:-pgvector/pgvector:pg17}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_hrms
      POSTGRES_USER: ai_hrms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_hrms -d ai_hrms"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - ai_hrms_pgdata:/var/lib/postgresql/data

  api:
    image: ${TCR_REGISTRY:?TCR_REGISTRY is required}/${TCR_NAMESPACE:?TCR_NAMESPACE is required}/ai-hrms-api:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:?DOCKER_DATABASE_URL is required}
      AI_HRMS_ENV: ${AI_HRMS_ENV:-production}
      AI_HRMS_ENABLE_DEMO_SEED: ${AI_HRMS_ENABLE_DEMO_SEED:-false}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      API_PORT: 8080
      CORS_ALLOWED_ORIGINS: ${DOCKER_CORS_ALLOWED_ORIGINS:?DOCKER_CORS_ALLOWED_ORIGINS is required}
      AI_HRMS_INGEST_ROOT: ${DOCKER_AI_HRMS_INGEST_ROOT:-}
      AI_HRMS_ENABLE_AGENT_URL_CONNECTOR: ${AI_HRMS_ENABLE_AGENT_URL_CONNECTOR:-false}
      AGENT_BASE_URL: ${AGENT_BASE_URL:-http://agent:8090}
      AGENT_TIMEOUT_SECONDS: ${AGENT_TIMEOUT_SECONDS:-30}
      AI_HRMS_AGENT_SERVICE_TOKEN: ${AI_HRMS_AGENT_SERVICE_TOKEN:-}
      AI_CHAT_PROVIDER: ${AI_CHAT_PROVIDER:-fake}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_CHAT_MODEL: ${DEEPSEEK_CHAT_MODEL:-deepseek-v4-flash}
      DEEPSEEK_REASONING_EFFORT: ${DEEPSEEK_REASONING_EFFORT:-high}
      DEEPSEEK_TIMEOUT_SECONDS: ${DEEPSEEK_TIMEOUT_SECONDS:-30}
      AI_EMBEDDING_PROVIDER: ${AI_EMBEDDING_PROVIDER:-fake}
      OPENAI_COMPATIBLE_EMBEDDING_BASE_URL: ${OPENAI_COMPATIBLE_EMBEDDING_BASE_URL:-}
      OPENAI_COMPATIBLE_EMBEDDING_MODEL: ${OPENAI_COMPATIBLE_EMBEDDING_MODEL:-}
      RAG_EMBEDDING_DIMENSIONS: ${RAG_EMBEDDING_DIMENSIONS:-8}
    ports:
      - target: 8080
        published: "${API_PORT:-8020}"
        host_ip: "${DOCKER_BIND_IP:-127.0.0.1}"
        protocol: tcp
    depends_on:
      postgres:
        condition: service_healthy
      agent:
        condition: service_healthy

  bootstrap-admin:
    profiles: ["bootstrap"]
    image: ${TCR_REGISTRY:?TCR_REGISTRY is required}/${TCR_NAMESPACE:?TCR_NAMESPACE is required}/ai-hrms-api:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: "no"
    entrypoint: ["ai-hrms-admin", "bootstrap-admin"]
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:?DOCKER_DATABASE_URL is required}
      AI_HRMS_ENV: ${AI_HRMS_ENV:-production}
      AI_HRMS_ENABLE_DEMO_SEED: ${AI_HRMS_ENABLE_DEMO_SEED:-false}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
    depends_on:
      postgres:
        condition: service_healthy

  seed-sample-company:
    profiles: ["sample-data"]
    image: ${TCR_REGISTRY:?TCR_REGISTRY is required}/${TCR_NAMESPACE:?TCR_NAMESPACE is required}/ai-hrms-api:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: "no"
    entrypoint: ["ai-hrms-admin", "seed-sample-company", "--yes"]
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:?DOCKER_DATABASE_URL is required}
      AI_HRMS_ENV: ${AI_HRMS_ENV:-production}
      AI_HRMS_ENABLE_DEMO_SEED: ${AI_HRMS_ENABLE_DEMO_SEED:-false}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: ${TCR_REGISTRY:?TCR_REGISTRY is required}/${TCR_NAMESPACE:?TCR_NAMESPACE is required}/ai-hrms-web:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    ports:
      - target: 80
        published: "${WEB_PORT:-8021}"
        host_ip: "${DOCKER_BIND_IP:-127.0.0.1}"
        protocol: tcp
    depends_on:
      api:
        condition: service_healthy

  agent:
    image: ${TCR_REGISTRY:?TCR_REGISTRY is required}/${TCR_NAMESPACE:?TCR_NAMESPACE is required}/ai-hrms-agent:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      AI_HRMS_INGEST_ROOT: ${DOCKER_AI_HRMS_INGEST_ROOT:-}
      AI_HRMS_ENABLE_AGENT_URL_CONNECTOR: ${AI_HRMS_ENABLE_AGENT_URL_CONNECTOR:-false}
      AI_HRMS_AGENT_SERVICE_TOKEN: ${AI_HRMS_AGENT_SERVICE_TOKEN:-}
      AI_CHAT_PROVIDER: ${AI_CHAT_PROVIDER:-fake}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_CHAT_MODEL: ${DEEPSEEK_CHAT_MODEL:-deepseek-v4-flash}
      DEEPSEEK_REASONING_EFFORT: ${DEEPSEEK_REASONING_EFFORT:-high}
      DEEPSEEK_TIMEOUT_SECONDS: ${DEEPSEEK_TIMEOUT_SECONDS:-30}
      AI_EMBEDDING_PROVIDER: ${AI_EMBEDDING_PROVIDER:-fake}
      OPENAI_COMPATIBLE_EMBEDDING_API_KEY: ${OPENAI_COMPATIBLE_EMBEDDING_API_KEY:-}
      OPENAI_COMPATIBLE_EMBEDDING_BASE_URL: ${OPENAI_COMPATIBLE_EMBEDDING_BASE_URL:-}
      OPENAI_COMPATIBLE_EMBEDDING_MODEL: ${OPENAI_COMPATIBLE_EMBEDDING_MODEL:-}
      RAG_EMBEDDING_DIMENSIONS: ${RAG_EMBEDDING_DIMENSIONS:-8}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=2).read()\""]
      interval: 10s
      timeout: 3s
      retries: 12

  embedding:
    profiles: ["embedding"]
    image: ${AI_HRMS_EMBEDDING_IMAGE:-ghcr.io/ggml-org/llama.cpp:server}
    restart: unless-stopped
    mem_limit: ${LOCAL_EMBEDDING_MEMORY_LIMIT:-2g}
    command:
      - -hf
      - ${LOCAL_EMBEDDING_MODEL:-Qwen/Qwen3-Embedding-0.6B-GGUF:Q8_0}
      - --embedding
      - --pooling
      - last
      - --ctx-size
      - ${LOCAL_EMBEDDING_CTX_SIZE:-2048}
      - --threads
      - ${LOCAL_EMBEDDING_THREADS:-2}
      - --parallel
      - ${LOCAL_EMBEDDING_PARALLEL:-1}
      - --ubatch-size
      - ${LOCAL_EMBEDDING_UBATCH_SIZE:-512}
      - --cache-ram
      - ${LOCAL_EMBEDDING_CACHE_RAM:-0}
      - --api-key
      - ${LOCAL_EMBEDDING_API_KEY:-local-no-auth}
      - --host
      - 0.0.0.0
      - --port
      - "80"
    environment:
      HF_HOME: /root/.cache/huggingface
    ports:
      - target: 80
        published: "${EMBEDDING_PORT:-8082}"
        host_ip: "${DOCKER_BIND_IP:-127.0.0.1}"
        protocol: tcp
    volumes:
      - ai_hrms_embedding_cache:/root/.cache
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:80/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 20

volumes:
  ai_hrms_pgdata:
  ai_hrms_embedding_cache:
