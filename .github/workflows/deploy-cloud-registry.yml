name: Build and Deploy with Private Registry

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_TAG: ${{ github.sha }}
  IMAGE_REGISTRY: ${{ vars.IMAGE_REGISTRY }}
  IMAGE_NAMESPACE: ${{ vars.IMAGE_NAMESPACE }}
  VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || '/api' }}
  VITE_DEMO_MODE: ${{ vars.VITE_DEMO_MODE || 'false' }}

jobs:
  build:
    name: Build and push images
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate registry settings
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          test -n "$IMAGE_REGISTRY"
          test -n "$IMAGE_NAMESPACE"
          test -n "$REGISTRY_USERNAME"
          test -n "$REGISTRY_PASSWORD"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to private registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/ai-hrms-api:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/ai-hrms-api:latest
          cache-from: type=gha,scope=ai-hrms-api
          cache-to: type=gha,mode=max,scope=ai-hrms-api

      - name: Build and push Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          build-args: |
            VITE_API_BASE_URL=${{ env.VITE_API_BASE_URL }}
            VITE_DEMO_MODE=${{ env.VITE_DEMO_MODE }}
          tags: |
            ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/ai-hrms-web:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/ai-hrms-web:latest
          cache-from: type=gha,scope=ai-hrms-web
          cache-to: type=gha,mode=max,scope=ai-hrms-web

      - name: Build and push Agent image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/agent/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/ai-hrms-agent:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/ai-hrms-agent:latest
          cache-from: type=gha,scope=ai-hrms-agent
          cache-to: type=gha,mode=max,scope=ai-hrms-agent

  deploy:
    name: Deploy on cloud server
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    environment: production

    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/projects/ai-hrms' }}
      DEPLOY_BRANCH: ${{ vars.DEPLOY_BRANCH || github.ref_name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate SSH settings
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_PORT"
          test -n "$DEPLOY_PATH"
          test -n "$DEPLOY_BRANCH"

      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Sync deployment files
        run: |
          tar \
            --exclude='.git' \
            --exclude='.env' \
            --exclude='infra/.env' \
            --exclude='node_modules' \
            --exclude='apps/web/node_modules' \
            --exclude='apps/web/dist' \
            --exclude='apps/agent/.venv' \
            --exclude='.uv-cache' \
            -czf - . | ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p \"$DEPLOY_PATH\" && tar -xzf - -C \"$DEPLOY_PATH\""

      - name: Deploy over SSH
        run: |
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "bash -se" <<REMOTE
          cd "$DEPLOY_PATH"
          if [[ ! -f infra/.env ]]; then
            echo "Missing $DEPLOY_PATH/infra/.env. Create it from infra/.env.example on the server and fill production values."
            exit 1
          fi
          export IMAGE_REGISTRY="$IMAGE_REGISTRY"
          export IMAGE_NAMESPACE="$IMAGE_NAMESPACE"
          export IMAGE_TAG="$IMAGE_TAG"
          ./infra/deploy.sh
          REMOTE
