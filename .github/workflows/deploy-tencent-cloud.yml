name: Build and Deploy to Tencent Cloud

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_TAG: ${{ github.sha }}
  TCR_REGISTRY: ${{ vars.TCR_REGISTRY }}
  TCR_NAMESPACE: ${{ vars.TCR_NAMESPACE }}
  VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || '/api' }}
  VITE_DEMO_MODE: ${{ vars.VITE_DEMO_MODE || 'false' }}

jobs:
  build:
    name: Build and push images
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate TCR settings
        env:
          TCR_USERNAME: ${{ secrets.TCR_USERNAME }}
          TCR_PASSWORD: ${{ secrets.TCR_PASSWORD }}
        run: |
          test -n "$TCR_REGISTRY"
          test -n "$TCR_NAMESPACE"
          test -n "$TCR_USERNAME"
          test -n "$TCR_PASSWORD"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Tencent Cloud TCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.TCR_REGISTRY }}
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.TCR_REGISTRY }}/${{ env.TCR_NAMESPACE }}/ai-hrms-api:${{ env.IMAGE_TAG }}
            ${{ env.TCR_REGISTRY }}/${{ env.TCR_NAMESPACE }}/ai-hrms-api:latest

      - name: Build and push Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          build-args: |
            VITE_API_BASE_URL=${{ env.VITE_API_BASE_URL }}
            VITE_DEMO_MODE=${{ env.VITE_DEMO_MODE }}
          tags: |
            ${{ env.TCR_REGISTRY }}/${{ env.TCR_NAMESPACE }}/ai-hrms-web:${{ env.IMAGE_TAG }}
            ${{ env.TCR_REGISTRY }}/${{ env.TCR_NAMESPACE }}/ai-hrms-web:latest

      - name: Build and push Agent image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/agent/Dockerfile
          push: true
          tags: |
            ${{ env.TCR_REGISTRY }}/${{ env.TCR_NAMESPACE }}/ai-hrms-agent:${{ env.IMAGE_TAG }}
            ${{ env.TCR_REGISTRY }}/${{ env.TCR_NAMESPACE }}/ai-hrms-agent:latest

  deploy:
    name: Deploy on Tencent Cloud CVM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    environment: production

    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/ai-hrms' }}
      DEPLOY_BRANCH: ${{ vars.DEPLOY_BRANCH || github.ref_name }}

    steps:
      - name: Validate SSH settings
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_PORT"
          test -n "$DEPLOY_PATH"
          test -n "$DEPLOY_BRANCH"

      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Deploy over SSH
        run: |
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "bash -se" <<REMOTE
          cd "$DEPLOY_PATH"
          git fetch origin "$DEPLOY_BRANCH"
          git checkout "$DEPLOY_BRANCH"
          git pull --ff-only origin "$DEPLOY_BRANCH"
          export TCR_REGISTRY="$TCR_REGISTRY"
          export TCR_NAMESPACE="$TCR_NAMESPACE"
          export IMAGE_TAG="$IMAGE_TAG"
          ./infra/deploy.sh
          REMOTE
