  /learning/enrollments:
    get:
      tags: [Learning]
      operationId: listLearningEnrollments
      summary: List scoped learning enrollments
      responses:
        "200":
          description: Paged enrollments.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiEnvelope"

  /learning/recommendations:
    get:
      tags: [Learning]
      operationId: listLearningRecommendations
      summary: List scoped AI learning recommendations
      responses:
        "200":
          description: Paged recommendations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiEnvelope"

  /agent/runs:
    get:
      tags: [Agent]
      operationId: listAgentRuns
      summary: List caller agent runs
      responses:
        "200":
          description: Paged agent runs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiEnvelope"
    post:
      tags: [Agent]
      operationId: createAgentRun
      summary: Create delegated agent run
      responses:
        "201":
          description: Created agent run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiEnvelope"

  /agent/tools/preview:
    post:
      tags: [Agent]
      operationId: previewAgentTool
      summary: Preview Go-gated agent tool call
      responses:
        "200":
          description: Tool preview result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiEnvelope"

  /visual-copilot/context:
    post:
      tags: [VisualCopilot]
      operationId: createVisualContext
      summary: Save visual context after Go business-ref validation
      responses:
        "200":
          description: Visual copilot event and result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiEnvelope"

  /visual-copilot/suggestions:
    post:
      tags: [VisualCopilot]
      operationId: createVisualSuggestions
      summary: Generate suggestions for selected screen regions
      responses:
        "200":
          description: Visual copilot suggestions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiEnvelope"

  /visual-copilot/actions/preview:
    post:
      tags: [VisualCopilot]
      operationId: previewVisualAction
      summary: Preview visual copilot action
      responses:
        "200":
          description: Action preview.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiEnvelope"

  /visual-copilot/actions/execute:
    post:
      tags: [VisualCopilot]
      operationId: executeVisualAction
      summary: Execute confirmed visual copilot action
      responses:
        "200":
          description: Executed action result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiEnvelope"

  /visual-copilot/events:
    get:
      tags: [VisualCopilot]
      operationId: listVisualCopilotEvents
      summary: List caller visual copilot events
      responses:
        "200":
          description: Paged visual copilot events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiEnvelope"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    Size:
      name: size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10

  responses:
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unauthorized:
      description: Missing, invalid, or expired bearer token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: Caller lacks the required RBAC scope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: Resource not found or outside caller scope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"

  schemas:
    ApiEnvelope:
      type: object
      required: [success, code, message]
      properties:
        success:
          type: boolean
        code:
          type: integer
          example: 2001
        message:
          type: string
        data: {}

    ErrorEnvelope:
      allOf:
        - $ref: "#/components/schemas/ApiEnvelope"
        - type: object
          required: [success, code, message]
          properties:
            success:
              const: false
            code:
              type: integer
              example: 4001
            message:
              type: string

    HealthEnvelope:
      allOf:
        - $ref: "#/components/schemas/ApiEnvelope"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/Health"

    LoginEnvelope:
      allOf:
        - $ref: "#/components/schemas/ApiEnvelope"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/LoginResult"

    UserEnvelope:
      allOf:
        - $ref: "#/components/schemas/ApiEnvelope"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/User"

