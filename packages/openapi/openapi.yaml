              schema:
                $ref: "#/components/schemas/ApiEnvelope"

  /learning/courses:
    get:
      tags: [Learning]
      operationId: listLearningCourses
      summary: List scoped learning courses
      responses:
        "200":
          description: Paged learning courses.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiEnvelope"
    post:
      tags: [Learning]
      operationId: createLearningCourse
      summary: Create learning course
      responses:
        "201":
          description: Created learning course.
          content:
            application/json:
              schema:
