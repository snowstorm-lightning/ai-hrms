openapi: 3.1.0
info:
  title: AI-HRMS API
  version: 0.1.0
  description: >
    Contract index for the current AI-HRMS reproduction phase. The API serves
    one corporate group with multiple legal entities; legal entities are
    organization scopes, not SaaS tenants.
servers:
  - url: http://localhost:8080/api
    description: Local Go API
security:
  - bearerAuth: []
tags:
  - name: Health
  - name: Auth
  - name: Organization
  - name: Roles
  - name: Users
  - name: Employees
  - name: Attendance
  - name: Messages
  - name: Audit
  - name: RAG
  - name: Learning
  - name: Agent
  - name: VisualCopilot

paths:
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Health check
      security: []
      responses:
        "200":
          description: API is healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthEnvelope"

  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Login with mobile and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: JWT token and current user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /profile:
    get:
      tags: [Auth]
      operationId: getProfile
      summary: Get current user profile
      responses:
        "200":
          description: Current authenticated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /legal-entities:
    get:
      tags: [Organization]
      operationId: listLegalEntities
      summary: List visible legal entities
      description: Returns legal entities visible to the caller's RBAC scope.
      responses:
        "200":
          description: Visible legal entities.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegalEntityListEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Organization]
      operationId: createLegalEntity
      summary: Create legal entity
      description: Requires global role scope.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LegalEntityInput"
      responses:
        "201":
          description: Created legal entity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegalEntityEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /legal-entities/{id}:
    put:
      tags: [Organization]
      operationId: updateLegalEntity
      summary: Update legal entity
      description: Requires global role scope.
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LegalEntityInput"
      responses:
        "200":
          description: Updated legal entity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegalEntityEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /org-units:
    get:
      tags: [Organization]
      operationId: listOrgUnits
      summary: List visible organization units
      description: Organization units may have no legal entity.
      responses:
        "200":
          description: Visible organization units.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgUnitListEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Organization]
      operationId: createOrgUnit
      summary: Create organization unit
      description: Requires global role scope.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrgUnitInput"
      responses:
        "201":
          description: Created organization unit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgUnitEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /org-units/{id}:
    put:
      tags: [Organization]
      operationId: updateOrgUnit
      summary: Update organization unit
      description: Requires global role scope.
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrgUnitInput"
      responses:
        "200":
          description: Updated organization unit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgUnitEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /roles:
    get:
      tags: [Roles]
      operationId: listRoles
      summary: List roles
      description: Requires global role scope.
      responses:
        "200":
          description: Available roles.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleListEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /users:
    get:
      tags: [Users]
      operationId: listUsers
      summary: List users
      description: Requires global role scope.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Paged users.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPageEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Users]
      operationId: createUser
      summary: Create user
      description: Requires global role scope.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: Created user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /users/{id}:
    put:
      tags: [Users]
      operationId: updateUser
      summary: Update user
      description: Requires global role scope.
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: Updated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /users/{id}/role-bindings:
    get:
      tags: [Roles]
      operationId: listUserRoleBindings
      summary: List user role bindings
      description: Requires global role scope.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: User role bindings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleBindingListEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      tags: [Roles]
      operationId: replaceUserRoleBindings
      summary: Replace user role bindings
      description: Requires global role scope.
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplaceRoleBindingsRequest"
      responses:
        "200":
          description: Updated user role bindings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleBindingListEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /employees:
    get:
      tags: [Employees]
      operationId: listEmployees
      summary: List employees with primary assignment
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Paged employees visible to caller scope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeePageEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Employees]
      operationId: createEmployee
      summary: Create employee
      description: Requires global role scope in the current implementation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeInput"
      responses:
        "201":
          description: Created employee.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /employees/export:
    get:
      tags: [Employees]
      operationId: exportEmployees
      summary: Export visible employees as CSV
      responses:
        "200":
          description: UTF-8 CSV file.
          content:
            text/csv:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"

  /employees/{id}:
    get:
      tags: [Employees]
      operationId: getEmployee
      summary: Get employee by id
      description: Returns only employees visible to caller scope.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Employee detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Employees]
      operationId: updateEmployee
      summary: Update employee
      description: Requires global role scope in the current implementation.
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeInput"
      responses:
        "200":
          description: Updated employee.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /attendance:
    get:
      tags: [Attendance]
      operationId: listAttendance
      summary: List attendance records
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Paged attendance visible to caller scope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendancePageEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Attendance]
      operationId: createAttendance
      summary: Check in an employee
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAttendanceRequest"
      responses:
        "201":
          description: Created attendance record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /attendance/export:
    get:
      tags: [Attendance]
      operationId: exportAttendance
      summary: Export visible attendance records as CSV
      responses:
        "200":
          description: UTF-8 CSV file.
          content:
            text/csv:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"

  /attendance/{id}/checkout:
    put:
      tags: [Attendance]
      operationId: checkoutAttendance
      summary: Check out an attendance record
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Updated attendance record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /messages:
    get:
      tags: [Messages]
      operationId: listMessages
      summary: List messages
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Paged messages.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessagePageEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Messages]
      operationId: createMessage
      summary: Create message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMessageRequest"
      responses:
        "201":
          description: Created message.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /messages/{id}/comments:
    get:
      tags: [Messages]
      operationId: listComments
      summary: List message comments
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Message comments.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentListEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Messages]
      operationId: createComment
      summary: Create message comment
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCommentRequest"
      responses:
        "201":
          description: Created comment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /audit/events:
    get:
      tags: [Audit]
      operationId: listAuditEvents
      summary: List scoped audit events
      responses:
        "200":
          description: Paged audit events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiEnvelope"

  /rag/sources:
    get:
      tags: [RAG]
      operationId: listRagSources
      summary: List RAG sources
      responses:
        "200":
          description: RAG source list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiEnvelope"
    post:
      tags: [RAG]
      operationId: createRagSource
      summary: Create RAG source
      responses:
        "201":
          description: Created RAG source.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiEnvelope"

  /rag/documents:
    get:
      tags: [RAG]
      operationId: listRagDocuments
      summary: List scoped RAG documents
      responses:
        "200":
          description: Paged RAG documents.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiEnvelope"
    post:
      tags: [RAG]
      operationId: createRagDocument
      summary: Create scoped RAG document and deterministic chunks
      responses:
        "201":
          description: Created RAG document.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiEnvelope"

  /rag/ingest-jobs:
    post:
      tags: [RAG]
      operationId: createRagIngestJob
      summary: Create ingestion job
      responses:
        "201":
          description: Created ingestion job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiEnvelope"

  /rag/ingest-jobs/{id}:
    get:
      tags: [RAG]
      operationId: getRagIngestJob
      summary: Get ingestion job
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Ingestion job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiEnvelope"

  /rag/search:
    post:
      tags: [RAG]
      operationId: searchRag
      summary: Search scoped RAG knowledge
      responses:
        "200":
          description: Search answer with citations or refusal reason.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiEnvelope"

  /ai/chat:
    post:
      tags: [RAG]
      operationId: aiChat
      summary: Citation-grounded AI chat
      responses:
        "200":
          description: Chat response with citations.
          content:
